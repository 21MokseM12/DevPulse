name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: maven build
        run: ./mvnw verify

      - id: jacoco
        uses: madrapps/jacoco-report@v1.7.1
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/report/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage
          update-comment: true

  linter:
    name: Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - run: ./mvnw compile -am spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check

  integration-e2e:
    name: Integration and E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: run integration/e2e suite
        run: ./mvnw -pl bot,scrapper -Dtest='*Integration*Test,*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false test

  build-and-push-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - verify
      - linter
      - integration-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devpulse-bot:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devpulse-bot:latest
      - name: Build and push scrapper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scrapper/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devpulse-scrapper:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devpulse-scrapper:latest
