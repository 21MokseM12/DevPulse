apiVersion: v1
kind: Service
metadata:
  name: bot-postgres
  namespace: devpulse-production
spec:
  selector:
    app: bot-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bot-postgres
  namespace: devpulse-production
spec:
  serviceName: bot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bot-postgres
  template:
    metadata:
      labels:
        app: bot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: BOT_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: BOT_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: devpulse-secrets
                  key: BOT_POSTGRES_DB_NAME
          volumeMounts:
            - name: bot-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: bot-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
