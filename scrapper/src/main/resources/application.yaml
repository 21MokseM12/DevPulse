server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

app:
  scrapper:
    delivery:
      mode: ${SCRAPPER_DELIVERY_MODE:http}
    scheduler:
      interval: 15s
      force-check-delay: 30s
      thread-pool-size: 4
    outbox:
      topic: ${SCRAPPER_OUTBOX_TOPIC:link-updates}
      interval: ${SCRAPPER_OUTBOX_INTERVAL:5s}
      batch-size: ${SCRAPPER_OUTBOX_BATCH_SIZE:100}
    auth:
      header: ${SCRAPPER_AUTH_HEADER:X-Internal-Secret}
      shared-secret: ${INTERNAL_SHARED_SECRET:devpulse-internal-secret}
    github:
      token: ${GITHUB_TOKEN}
      url: https://api.github.com
    stackoverflow:
      url: https://api.stackexchange.com/2.3
      key: ${SO_TOKEN_KEY}
      access-token: ${SO_ACCESS_TOKEN}
    bot-url: ${SCRAPPER_BOT_URL:${BOT_URL:http://bot:8080}}
  database:
    page-size: 1000

kafka:
  properties:
    bootstrap-servers: ${SCRAPPER_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    retry-policy:
      interval: 1000
      multiplier: 2.0
      maxDelay: 10000
      max-attempts: 3
      auto-create-topics: true
    consumer:
      enable-auto-commit: false
      ack-mode: manual
      auto-offset-reset: earliest
      trusted-packages: "*"
    producer:
      client-id: common-kafka-sender
      enable-idempotence-config: true
      acks-config: all
  consumers:
    client-listener:
      group-id: client-consumer-group
      topic: client-listener-topic-request
      concurrency: 2
    link-listener:
      group-id: link-consumer-group
      topic: link-listener-topic-request
      concurrency: 2
  producers:
    common-sender:
      topic: link-topic-response

spring:
  kafka:
    bootstrap-servers: ${SCRAPPER_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
  datasource:
    username: ${SCRAPPER_POSTGRES_USER:${POSTGRES_USER:postgres}}
    password: ${SCRAPPER_POSTGRES_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    url: ${SCRAPPER_POSTGRES_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/devpulse_scrapper}}
    driver-class-name: org.postgresql.Driver
  application:
    name: backend-processor
  liquibase:
    enabled: true
    change-log: classpath:db/migrations/master.xml

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.lang.RuntimeException
    instances:
      github-api:
        base-config: default
      stackoverflow-api:
        base-config: default
      bot-api:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      github-api:
        base-config: default
      stackoverflow-api:
        base-config: default
      bot-api:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
    instances:
      github-api:
        base-config: default
      stackoverflow-api:
        base-config: default
      bot-api:
        base-config: default
