services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      - BOT_SCRAPPER_URL=http://scrapper:8081
      - BOT_POSTGRES_URL=jdbc:postgresql://bot-db:5432/${BOT_POSTGRES_DB_NAME:-devpulse_bot}
      - BOT_POSTGRES_USER=${BOT_POSTGRES_USER:-postgres}
      - BOT_POSTGRES_PASSWORD=${BOT_POSTGRES_PASSWORD:-postgres}
      - BOT_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BOT_REDIS_HOST=redis
      - BOT_REDIS_PORT=6379
      - BOT_REDIS_DATABASE=${BOT_REDIS_DATABASE:-1}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-devpulse-internal-secret}
    ports:
      - "8080:8080"
      - "25000:5005"
    depends_on:
      scrapper:
        condition: service_healthy
      bot-db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://localhost:8080/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    environment:
      - SCRAPPER_BOT_URL=http://bot:8080
      - SCRAPPER_POSTGRES_URL=jdbc:postgresql://scrapper-db:5432/${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}
      - SCRAPPER_POSTGRES_USER=${SCRAPPER_POSTGRES_USER:-postgres}
      - SCRAPPER_POSTGRES_PASSWORD=${SCRAPPER_POSTGRES_PASSWORD:-postgres}
      - SCRAPPER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCRAPPER_REDIS_HOST=redis
      - SCRAPPER_REDIS_PORT=6379
      - SCRAPPER_REDIS_DATABASE=${SCRAPPER_REDIS_DATABASE:-0}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-devpulse-internal-secret}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SO_TOKEN_KEY=${SO_TOKEN_KEY}
      - SO_ACCESS_TOKEN=${SO_ACCESS_TOKEN}
    depends_on:
      scrapper-db:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "25005:5005"
    healthcheck:
      test: "curl --fail --silent http://localhost:8081/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  bot-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${BOT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${BOT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${BOT_POSTGRES_DB_NAME:-devpulse_bot}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOT_POSTGRES_USER:-postgres} -d ${BOT_POSTGRES_DB_NAME:-devpulse_bot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - bot-db-data:/var/lib/postgresql/data

  scrapper-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${SCRAPPER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SCRAPPER_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCRAPPER_POSTGRES_USER:-postgres} -d ${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - scrapper-db-data:/var/lib/postgresql/data

  kafka:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bot-db-data:
  scrapper-db-data:
