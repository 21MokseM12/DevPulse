services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      no_cache: true
      pull: true
    pull_policy: build
    environment:
      - BOT_SCRAPPER_URL=http://scrapper:8081
      - BOT_POSTGRES_URL=jdbc:postgresql://bot-db:5432/${BOT_POSTGRES_DB_NAME:-devpulse_bot}
      - BOT_POSTGRES_USER=${BOT_POSTGRES_USER:-postgres}
      - BOT_POSTGRES_PASSWORD=${BOT_POSTGRES_PASSWORD:-postgres}
      - BOT_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BOT_REDIS_HOST=redis
      - BOT_REDIS_PORT=6379
      - BOT_REDIS_DATABASE=${BOT_REDIS_DATABASE:-1}
      - BOT_FCM_PROJECT_ID=${BOT_FCM_PROJECT_ID:-}
      - BOT_FCM_CREDENTIALS_PATH=/run/secrets/bot-fcm-service-account.json
      - BOT_FCM_ENDPOINT_TEMPLATE=${BOT_FCM_ENDPOINT_TEMPLATE:-https://fcm.googleapis.com/v1/projects/%s/messages:send}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-devpulse-internal-secret}
    volumes:
      - ./firebase-service-account.json:/run/secrets/bot-fcm-service-account.json:ro
    ports:
      - "8080:8080"
      - "25000:5005"
    depends_on:
      scrapper:
        condition: service_healthy
      bot-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://localhost:8080/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
      no_cache: true
      pull: true
    pull_policy: build
    environment:
      - SCRAPPER_BOT_URL=http://bot:8080
      - SCRAPPER_POSTGRES_URL=jdbc:postgresql://scrapper-db:5432/${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}
      - SCRAPPER_POSTGRES_USER=${SCRAPPER_POSTGRES_USER:-postgres}
      - SCRAPPER_POSTGRES_PASSWORD=${SCRAPPER_POSTGRES_PASSWORD:-postgres}
      - POSTGRES_URL=jdbc:postgresql://scrapper-db:5432/${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}
      - POSTGRES_USER=${SCRAPPER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${SCRAPPER_POSTGRES_PASSWORD:-postgres}
      - SCRAPPER_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCRAPPER_REDIS_HOST=redis
      - SCRAPPER_REDIS_PORT=6379
      - SCRAPPER_REDIS_DATABASE=${SCRAPPER_REDIS_DATABASE:-0}
      - INTERNAL_SHARED_SECRET=${INTERNAL_SHARED_SECRET:-devpulse-internal-secret}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SO_TOKEN_KEY=${SO_TOKEN_KEY}
      - SO_ACCESS_TOKEN=${SO_ACCESS_TOKEN}
    depends_on:
      scrapper-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "25005:5005"
    healthcheck:
      test: "curl --fail --silent http://localhost:8081/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  bot-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${BOT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${BOT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${BOT_POSTGRES_DB_NAME:-devpulse_bot}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOT_POSTGRES_USER:-postgres} -d ${BOT_POSTGRES_DB_NAME:-devpulse_bot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - bot-db-data:/var/lib/postgresql/data

  scrapper-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${SCRAPPER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SCRAPPER_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCRAPPER_POSTGRES_USER:-postgres} -d ${SCRAPPER_POSTGRES_DB_NAME:-devpulse_scrapper}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - scrapper-db-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link-updates --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic client-listener-topic-request --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link-listener-topic-request --partitions 2 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link-topic-response --partitions 2 --replication-factor 1

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bot-db-data:
  scrapper-db-data:
