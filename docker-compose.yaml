services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SCRAPPER_URL=http://scrapper:8081
      - BOT_POSTGRES_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB_NAME}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      scrapper:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  scrapper:
    build:
      context: .
      dockerfile: scrapper/Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - BOT_URL=http://bot:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB_NAME}
      - SO_TOKEN_KEY=${SO_TOKEN_KEY}
      - SO_ACCESS_TOKEN=${SO_ACCESS_TOKEN}
    depends_on:
      - postgres-db
      - kafka
    ports:
      - "25005:5005"
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 5

  postgres-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"

  kafka:
    image: redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"

  liquibase:
    image: liquibase/liquibase
    container_name: liquibase-migrations
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    depends_on:
      - postgres-db
    volumes:
      - ./migrations:/liquibase/changelog
    command: >
      update
      --url=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB_NAME}
      --username=${POSTGRES_USER}
      --password=${POSTGRES_PASSWORD}
      --changeLogFile=./changelog/master.xml
