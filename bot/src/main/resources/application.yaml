server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui

app:
  scrapper-url: ${BOT_SCRAPPER_URL:${SCRAPPER_URL:http://localhost:8081}}
  shared-secret: ${INTERNAL_SHARED_SECRET:devpulse-internal-secret}
  internal-header: ${INTERNAL_SHARED_HEADER:X-Internal-Secret}
  push:
    fcm:
      endpoint: ${BOT_FCM_ENDPOINT:https://fcm.googleapis.com/fcm/send}
      server-key: ${BOT_FCM_SERVER_KEY:}
    retry:
      max-attempts: ${BOT_PUSH_MAX_ATTEMPTS:3}
      initial-delay-ms: ${BOT_PUSH_INITIAL_DELAY_MS:1000}
      multiplier: ${BOT_PUSH_BACKOFF_MULTIPLIER:2.0}
      max-delay-ms: ${BOT_PUSH_MAX_DELAY_MS:5000}
    token-api-rate-limit-per-minute: ${BOT_PUSH_TOKEN_RATE_LIMIT_PER_MINUTE:60}
  kafka:
    consumers:
      link-updates:
        topic: ${BOT_LINK_UPDATES_TOPIC:link-updates}
        group-id: ${BOT_LINK_UPDATES_GROUP_ID:bot-link-updates-consumer}
    retry-policy:
      interval: ${BOT_KAFKA_RETRY_INTERVAL:1000}
      multiplier: ${BOT_KAFKA_RETRY_MULTIPLIER:2.0}
      max-delay: ${BOT_KAFKA_RETRY_MAX_DELAY:5000}
      max-attempts: ${BOT_KAFKA_RETRY_MAX_ATTEMPTS:3}
      auto-create-topics: ${BOT_KAFKA_RETRY_AUTO_CREATE_TOPICS:true}

spring:
  data:
    redis:
      host: ${BOT_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${BOT_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${BOT_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${BOT_REDIS_DATABASE:${REDIS_DATABASE:0}}
  datasource:
    username: ${BOT_POSTGRES_USER:${POSTGRES_USER:postgres}}
    password: ${BOT_POSTGRES_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    url: ${BOT_POSTGRES_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5433/devpulse_bot}}
    driver-class-name: org.postgresql.Driver
  application:
    name: frontend-message-processor
  liquibase:
    enabled: true
    change-log: classpath:db/migrations/master.xml
  kafka:
    bootstrap-servers: ${BOT_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 1

logging:
  config: classpath:logback-dev.xml
